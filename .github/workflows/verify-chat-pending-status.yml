name: Temporary chat queue-repair verification

on:
  push:
    branches: ['verify/chat-pending-status-2298']

permissions:
  contents: read

concurrency:
  group: verify-chat-pending-status-2298
  cancel-in-progress: true

jobs:
  browser:
    name: Chat queue-repair browser contracts
    runs-on: gh-linux-8x
    timeout-minutes: 30
    env:
      CI: 'true'
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@v7
        with:
          ref: 3af809a69c06ca9b611b951d79eec7d89007f37d
          persist-credentials: false
      - name: Verify source identity
        run: test "$(git rev-parse HEAD)" = 3af809a69c06ca9b611b951d79eec7d89007f37d
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.30.3
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - name: Install declared dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate i18n messages
        run: pnpm run generate:i18n
      - name: Install CT-aligned Chromium
        timeout-minutes: 8
        run: node scripts/run-ct-tests.mjs --install-browsers --with-deps chromium
      - name: Run affected browser contracts and snapshots
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/results.json
        run: >-
          pnpm run test:ct --
          src/lib/components/__tests__/neutral-border-contract.ct.spec.ts
          src/lib/components/chat/__tests__/chat-event-geometry.ct.spec.ts
          src/lib/components/chat/__tests__/chat-panel-thinking-seams.ct.spec.ts
          src/lib/components/chat/__tests__/chat-panel-tool-message-seams.ct.spec.ts
          src/lib/components/chat/__tests__/destructive-contrast.ct.spec.ts
          src/lib/components/chat/__tests__/agent-subscription-inline.ct.spec.ts
          src/lib/components/chat/__tests__/chat-panel-pending-status-spacing.ct.spec.ts
          src/lib/components/chat/__tests__/subscription-card-gap.ct.spec.ts
          src/lib/components/chat/__tests__/attention-flow-spacing-geometry.ct.spec.ts
          src/lib/components/chat/__tests__/sticky-scroll-stability.ct.spec.ts
          src/lib/components/chat/__tests__/turn-failure-surface.ct.spec.ts
          --workers=1 --retries=0 --fail-on-flaky-tests --reporter=list,html,json
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chat-queue-repair-3af809a6
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7
